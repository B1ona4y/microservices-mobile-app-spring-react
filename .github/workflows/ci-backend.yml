name: CI Backend
on:
  pull_request:
    branches: [main]
    paths: ['oauth2/**']

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '26', distribution: 'temurin' }
      - name: Checkstyle
        run: cd oauth2 && ./mvnw checkstyle:check
      - name: Build & test
        run: cd oauth2 && ./mvnw verify
