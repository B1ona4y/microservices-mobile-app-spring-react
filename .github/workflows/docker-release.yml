name: Publish Docker image
on:
  release:
    types: [published]

jobs:
  push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./oauth2
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oauth2:latest
            ghcr.io/${{ github.repository_owner }}/oauth2:${{ github.event.release.tag_name }}
