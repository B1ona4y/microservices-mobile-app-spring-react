name: CI Frontend
on:
  pull_request:
    branches: [main]
    paths: ['front_react/**']

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd front_react && npm ci
      - name: Lint
        run: cd front_react && npx expo lint
      - name: Typecheck
        run: cd front_react && npx tsc --noEmit
