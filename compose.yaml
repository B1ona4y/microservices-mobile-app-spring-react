services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oauth2}
      POSTGRES_USER: ${POSTGRES_USER:-oauth2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oauth2}"]
      interval: 5s
      timeout: 5s
      retries: 5
  oauth2:
    build:
      context: ./oauth2
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY}
      APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-oauth2-demo}
      APP_JWT_EXPIRY_SECONDS: ${APP_JWT_EXPIRY_SECONDS:-3600}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-oauth2}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oauth2}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      APP_GITHUB_CLIENT_ID: ${APP_GITHUB_CLIENT_ID}
      APP_GITHUB_CLIENT_SECRET: ${APP_GITHUB_CLIENT_SECRET}

    restart: unless-stopped

  notebook-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTEBOOK_POSTGRES_DB:-notebookdb}
      POSTGRES_USER: ${NOTEBOOK_POSTGRES_USER:-notebookuser}
      POSTGRES_PASSWORD: ${NOTEBOOK_POSTGRES_PASSWORD}
    volumes:
      - notebook_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTEBOOK_POSTGRES_USER:-notebookuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  notebook:
    build:
      context: .
      dockerfile: notebook/Dockerfile
    depends_on:
      notebook-db:
        condition: service_healthy
    environment:
      APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://notebook-db:5432/${NOTEBOOK_POSTGRES_DB:-notebookdb}
      SPRING_DATASOURCE_USERNAME: ${NOTEBOOK_POSTGRES_USER:-notebookuser}
      SPRING_DATASOURCE_PASSWORD: ${NOTEBOOK_POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"

    restart: unless-stopped

  springcloudgateway:
    build:
      context: ./springcloudgateway
    ports:
      - "8080:8080"
    depends_on:
      - oauth2
      - notebook
    environment:
      APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY}

    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  notebook_db_data:
  pgadmin-data:
  minio_data:
